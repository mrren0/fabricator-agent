name: build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev debhelper dh-python python3 python3-venv

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp ../fabricator-agent_*_all.deb dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabricator-agent-deb
          path: dist/
